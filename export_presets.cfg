[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="assets/fonts/OFL.txt,assets/kenney/*/License.txt,assets/words/SCOWL-Copyright.txt,assets/audio/*/README.md"
exclude_filter="tests/*,tools/*,lookdev/*,assets/storybook/explore/*,assets/storybook/village/*,assets/storybook/cvc/*,assets/storybook/collision/*,storybook/explore/*,storybook/foundation/*,storybook/hybrid/*,storybook/village/*,storybook/cvc/*,scenes/foundation_*.tscn,scenes/cvc_land.tscn,scenes/village_quarter.tscn,scenes/hybrid_slice.tscn,scenes/direction_study.tscn,scenes/storybook_slice.tscn,village/foundation_village.tscn"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="WebPreview"
platform="Web"
runnable=true
export_filter="all_resources"
